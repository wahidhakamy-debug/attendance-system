{% extends "base.html" %}
{% block content %}

<div class="card">
    <h3 style="margin-top:0; color:#0284c7;">➕ إضافة نظام دوام (وردية جديدة)</h3>
    <form action="/add_shift" method="POST" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end;">
        <div><label>اسم الوردية</label><input type="text" name="name" placeholder="مثلاً: الوردية المرنة (8 ساعات)" required></div>
        <div>
            <label>نظام الدوام</label>
            <select name="shift_type">
                <option value="single">فترة واحدة متصلة</option>
                <option value="split">فترتين (دوام متقطع)</option>
                <option value="flexible">دوام مرن (بعدد الساعات)</option>
            </select>
        </div>
        <div><label>بداية الفترة 1</label><input type="time" name="start1" value="08:00" required></div>
        <div><label>نهاية الفترة 1</label><input type="time" name="end1" value="16:00" required></div>
        <div><label>بداية الفترة 2 (للمتقطع)</label><input type="time" name="start2"></div>
        <div><label>نهاية الفترة 2 (للمتقطع)</label><input type="time" name="end2"></div>
        <div><label>سماح التأخير (د)</label><input type="number" name="grace_period" value="15" required></div>
        <div><button type="submit" class="btn btn-primary" style="padding:12px; width:100%; font-size:16px;">➕ إضافة</button></div>
    </form>
</div>

<div class="card">
    <h3 style="margin-top:0;">🕒 الورديات وأنظمة الدوام المسجلة</h3>
    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr><th>اسم الوردية</th><th>النوع</th><th>بداية 1</th><th>نهاية 1</th><th>بداية 2</th><th>نهاية 2</th><th>سماح (د)</th><th>إجراء</th></tr>
            </thead>
            <tbody>
                {% for s in shifts %}
                <tr>
                    <form action="/edit_shift/{{ s.0 }}" method="POST">
                        <td><input type="text" name="name" value="{{ s.1 }}" required style="padding:6px; font-size:14px;"></td>
                        <td>
                            <select name="shift_type" style="padding:6px; font-size:14px;">
                                <option value="single" {% if s.2 == 'single' %}selected{% endif %}>متصل</option>
                                <option value="split" {% if s.2 == 'split' %}selected{% endif %}>فترتين</option>
                                <option value="flexible" {% if s.2 == 'flexible' %}selected{% endif %}>مرن</option>
                            </select>
                        </td>
                        <td><input type="time" name="start1" value="{{ s.3 }}" required style="padding:6px; font-size:14px;"></td>
                        <td><input type="time" name="end1" value="{{ s.4 }}" required style="padding:6px; font-size:14px;"></td>
                        <td><input type="time" name="start2" value="{{ s.5 }}" style="padding:6px; font-size:14px;"></td>
                        <td><input type="time" name="end2" value="{{ s.6 }}" style="padding:6px; font-size:14px;"></td>
                        <td><input type="number" name="grace_period" value="{{ s.7 }}" required style="padding:6px; font-size:14px; width:60px;"></td>
                        <td style="white-space: nowrap;">
                            <button type="submit" class="btn" style="background:#16a34a; padding:7px 10px;">💾 حفظ</button>
                            <a href="/delete_shift/{{ s.0 }}" onclick="return confirm('حذف هذه الوردية؟')" class="btn" style="background:#dc2626; padding:7px 10px; text-decoration:none;">حذف</a>
                        </td>
                    </form>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
