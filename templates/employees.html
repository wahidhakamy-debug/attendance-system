{% extends "base.html" %}
{% block content %}

<div class="card">
    <h3 style="margin-top:0; color:#0284c7;">➕ إضافة موظف جديد</h3>
    <form action="/add_employee" method="POST" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end;">
        <div><label>الرقم الوظيفي</label><input type="text" name="emp_id" placeholder="1005" required></div>
        <div><label>اسم الموظف</label><input type="text" name="name" placeholder="الاسم الكامل" required></div>
        <div><label>القسم</label><input type="text" name="department" placeholder="المبيعات" required></div>
        <div><label>المسمى الوظيفي</label><input type="text" name="job_title" placeholder="محاسب" required></div>
        <div>
            <label>الفرع المخصص</label>
            <select name="assigned_branch">
                <option value="جميع الفروع">🌐 جميع الفروع</option>
                {% for b in branches %}<option value="{{ b.1 }}">📍 {{ b.1 }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label>نظام الدوام (الوردية)</label>
            <select name="assigned_shift">
                {% for s in shifts %}<option value="{{ s.1 }}">🕒 {{ s.1 }}</option>{% endfor %}
            </select>
        </div>
        <div><label>كلمة المرور</label><input type="text" name="password" placeholder="123456" required></div>
        <div><button type="submit" class="btn btn-primary" style="padding:12px; width:100%; font-size:16px;">➕ إضافة الموظف</button></div>
    </form>
</div>

<div class="card">
    <h3 style="margin-top:0;">👥 قائمة الموظفين المسجلين (تعديل وحفظ)</h3>
    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr><th>الرقم</th><th>الاسم</th><th>القسم</th><th>المسمى</th><th>الفرع المخصص</th><th>الوردية</th><th>كلمة مرور جديدة</th><th>إجراء</th></tr>
            </thead>
            <tbody>
                {% for emp in employees %}
                <tr>
                    <form action="/edit_employee/{{ emp.0 }}" method="POST">
                        <td><strong>{{ emp.0 }}</strong></td>
                        <td><input type="text" name="name" value="{{ emp.1 }}" required style="padding:6px; font-size:14px;"></td>
                        <td><input type="text" name="department" value="{{ emp.2 }}" required style="padding:6px; font-size:14px;"></td>
                        <td><input type="text" name="job_title" value="{{ emp.3 }}" required style="padding:6px; font-size:14px;"></td>
                        <td>
                            <select name="assigned_branch" style="padding:6px; font-size:14px;">
                                <option value="جميع الفروع" {% if emp.4 == 'جميع الفروع' %}selected{% endif %}>🌐 جميع الفروع</option>
                                {% for b in branches %}<option value="{{ b.1 }}" {% if emp.4 == b.1 %}selected{% endif %}>📍 {{ b.1 }}</option>{% endfor %}
                            </select>
                        </td>
                        <td>
                            <select name="assigned_shift" style="padding:6px; font-size:14px;">
                                {% for s in shifts %}<option value="{{ s.1 }}" {% if emp.5 == s.1 %}selected{% endif %}>🕒 {{ s.1 }}</option>{% endfor %}
                            </select>
                        </td>
                        <td><input type="text" name="password" placeholder="اختياري" style="padding:6px; font-size:14px;"></td>
                        <td style="white-space: nowrap;">
                            <button type="submit" class="btn" style="background:#16a34a; padding:7px 12px;">💾 حفظ</button>
                            {% if emp.0 != 'admin' %}
                            <a href="/delete_emp/{{ emp.0 }}" onclick="return confirm('حذف هذا الموظف؟')" class="btn" style="background:#dc2626; padding:7px 12px; text-decoration:none;">حذف</a>
                            {% endif %}
                        </td>
                    </form>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
